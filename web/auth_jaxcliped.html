<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>JaxCliped — Studio Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            brand: {
              cyan: '#00F0FF',
              blue: '#0071E3',
              dark: '#07090E',
              card: '#0F1523',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #07090E;
      color: #F1F5F9;
      -webkit-font-smoothing: antialiased;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    .dark-glass {
      background: rgba(15, 21, 35, 0.85);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.08);
    }

    .dark-input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dark-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: #00F0FF;
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.2);
      outline: none;
    }

    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(99, 102, 241, 0.08) 50%, transparent 80%);
      filter: blur(90px);
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen relative flex items-center justify-center p-4 sm:p-6 overflow-x-hidden selection:bg-cyan-500/30 selection:text-cyan-200">

  <!-- Ambient Light Orbs -->
  <div class="ambient-glow top-1/4 left-1/4 -translate-x-1/2 -translate-y-1/2"></div>
  <div class="ambient-glow bottom-1/4 right-1/4 translate-x-1/2 translate-y-1/2"></div>

  <!-- Main Dark Glass Container -->
  <div class="dark-glass w-full max-w-[430px] rounded-3xl p-7 sm:p-9 relative z-10 my-auto">
    
    <!-- Brand Icon + Heading -->
    <div class="flex flex-col items-center text-center mb-6">
      <a href="/" class="group relative mb-3">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-400 via-blue-500 to-indigo-600 p-0.5 shadow-[0_0_20px_rgba(0,240,255,0.4)] transition-transform duration-300 group-hover:scale-105 active:scale-95 flex items-center justify-center">
          <div class="w-full h-full bg-[#090D14] rounded-[14px] flex items-center justify-center">
            <svg class="w-8 h-8 text-cyan-400 drop-shadow-md" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9.64 7.64c.23-.5.36-1.05.36-1.64 0-2.21-1.79-4-4-4S2 3.79 2 6s1.79 4 4 4c.59 0 1.14-.13 1.64-.36L10 12l-2.36 2.36C7.14 14.13 6.59 14 6 14c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4c0-.59-.13-1.14-.36-1.64L12 14l7 7h3v-1L9.64 7.64zM6 8c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm0 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm9.64-10.36L22 3h-3l-5 5 1.64 1.64z"/>
            </svg>
          </div>
        </div>
      </a>

      <div class="flex items-center gap-1.5">
        <h1 class="text-2xl font-extrabold tracking-tight text-white">Jax<span class="text-cyan-400">Cliped</span></h1>
      </div>
      <p id="page-subtitle" class="text-xs font-medium text-slate-400 mt-1">
        Sign in to your AI stream clipping studio
      </p>
    </div>

    <!-- Segmented Tabs -->
    <div class="bg-black/50 border border-white/10 p-1 rounded-full flex items-center mb-6 relative">
      <button id="tab-login" onclick="setMode('login')" class="flex-1 py-1.5 text-xs font-bold rounded-full transition-all duration-300 text-black bg-cyan-400 shadow-md">
        Sign In
      </button>
      <button id="tab-signup" onclick="setMode('signup')" class="flex-1 py-1.5 text-xs font-bold rounded-full transition-all duration-300 text-slate-400 hover:text-white">
        Create Account
      </button>
    </div>

    <!-- Auth Form -->
    <form onsubmit="handleAuth(event)" class="space-y-4">
      
      <!-- Name (Signup Only) -->
      <div id="group-name" class="hidden">
        <label class="block text-[11px] font-bold tracking-wider text-slate-400 uppercase mb-1.5 ml-1">Your Name</label>
        <div class="relative">
          <input type="text" id="input-name" placeholder="Creator Name" class="dark-input w-full px-4 py-3 rounded-2xl text-sm text-white placeholder-slate-500 font-medium"/>
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-[11px] font-bold tracking-wider text-slate-400 uppercase mb-1.5 ml-1">Email Address</label>
        <div class="relative">
          <input type="email" id="input-email" required placeholder="you@domain.com" class="dark-input w-full px-4 py-3 rounded-2xl text-sm text-white placeholder-slate-500 font-medium"/>
        </div>
      </div>

      <!-- Password -->
      <div>
        <div class="flex justify-between items-center mb-1.5 ml-1">
          <label class="block text-[11px] font-bold tracking-wider text-slate-400 uppercase">Password</label>
          <a href="#" id="forgot-link" onclick="handleForgot(event)" class="text-xs font-medium text-cyan-400 hover:underline">Forgot?</a>
        </div>
        <div class="relative">
          <input type="password" id="input-password" required placeholder="••••••••" class="dark-input w-full px-4 py-3 rounded-2xl text-sm text-white placeholder-slate-500 font-medium pr-10"/>
          <button type="button" onclick="togglePass('input-password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition">
            <span class="material-symbols-rounded text-lg">visibility</span>
          </button>
        </div>
      </div>

      <!-- Confirm Password (Signup Only) -->
      <div id="group-confirm" class="hidden">
        <label class="block text-[11px] font-bold tracking-wider text-slate-400 uppercase mb-1.5 ml-1">Confirm Password</label>
        <div class="relative">
          <input type="password" id="input-confirm" placeholder="••••••••" class="dark-input w-full px-4 py-3 rounded-2xl text-sm text-white placeholder-slate-500 font-medium pr-10"/>
        </div>
      </div>

      <!-- Alert / Error Toast -->
      <div id="auth-alert" class="hidden text-xs py-2.5 px-3.5 rounded-xl font-medium text-center"></div>

      <!-- Primary Action Button -->
      <button type="submit" id="submit-btn" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-cyan-400 via-sky-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-black text-sm font-extrabold shadow-[0_0_20px_rgba(0,240,255,0.4)] transition-all duration-200 active:scale-[0.98] mt-3 flex items-center justify-center gap-2">
        <span id="btn-text">Sign In</span>
      </button>

    </form>

    <!-- Footer Switch -->
    <p class="text-center text-xs text-slate-400 mt-6">
      <span id="footer-prompt">Don't have an account?</span>
      <button type="button" onclick="toggleMode()" id="footer-action" class="font-bold text-cyan-400 hover:underline ml-1">
        Sign Up
      </button>
    </p>

    <div class="mt-6 pt-4 border-t border-white/10 text-center text-[11px] text-slate-500">
      <span>🔒 256-Bit Encrypted Studio Login</span>
    </div>

  </div>

  <script>
    let mode = window.location.pathname.includes('signup') ? 'signup' : 'login';

    function setMode(newMode) {
      mode = newMode;
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const groupName = document.getElementById('group-name');
      const groupConfirm = document.getElementById('group-confirm');
      const forgotLink = document.getElementById('forgot-link');
      const btnText = document.getElementById('btn-text');
      const pageSubtitle = document.getElementById('page-subtitle');
      const footerPrompt = document.getElementById('footer-prompt');
      const footerAction = document.getElementById('footer-action');
      const alert = document.getElementById('auth-alert');
      alert.classList.add('hidden');

      const urlParams = new URLSearchParams(location.search);
      const queryStr = urlParams.toString() ? '?' + urlParams.toString() : '';

      if (mode === 'signup') {
        tabSignup.className = "flex-1 py-1.5 text-xs font-bold rounded-full transition-all duration-300 text-black bg-cyan-400 shadow-md";
        tabLogin.className = "flex-1 py-1.5 text-xs font-bold rounded-full transition-all duration-300 text-slate-400 hover:text-white";
        groupName.classList.remove('hidden');
        groupConfirm.classList.remove('hidden');
        forgotLink.classList.add('hidden');
        btnText.innerText = "Create Account & Continue";
        pageSubtitle.innerText = "Get started with JaxCliped AI Studio";
        footerPrompt.innerText = "Already have an account?";
        footerAction.innerText = "Sign In";
        history.replaceState(null, '', '/signup' + queryStr);
      } else {
        tabLogin.className = "flex-1 py-1.5 text-xs font-bold rounded-full transition-all duration-300 text-black bg-cyan-400 shadow-md";
        tabSignup.className = "flex-1 py-1.5 text-xs font-bold rounded-full transition-all duration-300 text-slate-400 hover:text-white";
        groupName.classList.add('hidden');
        groupConfirm.classList.add('hidden');
        forgotLink.classList.remove('hidden');
        btnText.innerText = "Sign In to Studio";
        pageSubtitle.innerText = "Sign in to your AI stream clipping studio";
        footerPrompt.innerText = "Don't have an account?";
        footerAction.innerText = "Sign Up";
        history.replaceState(null, '', '/login' + queryStr);
      }
    }

    function toggleMode() {
      setMode(mode === 'login' ? 'signup' : 'login');
    }

    function togglePass(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    function showAlert(msg, isSuccess = false) {
      const alert = document.getElementById('auth-alert');
      alert.innerText = msg;
      alert.className = `text-xs py-2.5 px-3.5 rounded-xl font-medium text-center ${
        isSuccess 
          ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-500/30' 
          : 'bg-rose-950/80 text-rose-300 border border-rose-500/30'
      }`;
      alert.classList.remove('hidden');
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const btn = document.getElementById('submit-btn');

      if (mode === 'signup') {
        const confirm = document.getElementById('input-confirm').value;
        if (password !== confirm) {
          showAlert("Passwords do not match");
          return;
        }
      }

      btn.disabled = true;
      btn.classList.add('opacity-70');

      try {
        const endpoint = mode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
        const payload = mode === 'signup' 
          ? { email, password, name: document.getElementById('input-name').value.trim() || email.split('@')[0] }
          : { email, password };

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const msg = typeof data.detail === 'string' ? data.detail : (Array.isArray(data.detail) && data.detail[0]?.msg ? data.detail[0].msg : "Authentication failed");
          throw new Error(msg);
        }

        showAlert("Success! Entering JaxCliped Studio...", true);
        const nextParam = new URLSearchParams(location.search).get("next");
        // Safe destination; defaults to plan selection modal if none specified
        const dest = nextParam && /^\/(?![\/\\])[^\\\t\r\n]*$/.test(nextParam) ? nextParam : '/app?select_plan=1';
        setTimeout(() => { window.location.href = dest; }, 300);

      } catch (err) {
        showAlert(err.message || "An error occurred");
        btn.disabled = false;
        btn.classList.remove('opacity-70');
      }
    }

    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value.trim();
      if (!email) {
        showAlert("Enter your email address first");
        return;
      }
      try {
        await fetch('/api/auth/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        showAlert("Password reset link sent to your email", true);
      } catch {
        showAlert("Failed to send reset link");
      }
    }

    // Initialize initial state
    setMode(mode);
  </script>
</body>
</html>
