<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>JaxCliped — Studio Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          },
          colors: {
            apple: {
              blue: '#0071E3',
              hover: '#0077ED',
              dark: '#1D1D1F',
              sub: '#86868B',
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #F5F5F7;
      color: #1D1D1F;
      -webkit-font-smoothing: antialiased;
    }

    /* iOS Liquid Glass Effect */
    .ios-glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(40px) saturate(190%);
      -webkit-backdrop-filter: blur(40px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.07),
        0 0 1px 1px rgba(255, 255, 255, 0.9) inset;
    }

    .ios-input-glass {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ios-input-glass:focus {
      background: rgba(255, 255, 255, 0.95);
      border-color: #0071E3;
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
      outline: none;
    }

    /* Organic Apple Wallpaper Flowing Blobs */
    .blob-1 {
      position: absolute;
      top: -10%;
      left: 15%;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(147, 197, 253, 0.65) 0%, rgba(199, 210, 254, 0.2) 70%, transparent 100%);
      filter: blur(60px);
      animation: float-1 14s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .blob-2 {
      position: absolute;
      bottom: -10%;
      right: 10%;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(251, 207, 232, 0.6) 0%, rgba(221, 214, 254, 0.25) 70%, transparent 100%);
      filter: blur(70px);
      animation: float-2 16s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .blob-3 {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(186, 230, 253, 0.45) 0%, rgba(243, 232, 255, 0.2) 70%, transparent 100%);
      filter: blur(80px);
      pointer-events: none;
    }

    @keyframes float-1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.08); }
    }
    @keyframes float-2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-50px, -50px) scale(1.1); }
    }
  </style>
</head>
<body class="min-h-screen relative flex items-center justify-center p-4 sm:p-6 overflow-x-hidden selection:bg-blue-100 selection:text-blue-900">

  <!-- Ambient Apple iOS Wallpaper Blobs -->
  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="blob-3"></div>

  <!-- Main Glass Container -->
  <div class="ios-glass w-full max-w-[420px] rounded-[32px] p-7 sm:p-9 relative z-10 my-auto">
    
    <!-- Brand App Icon + Heading -->
    <div class="flex flex-col items-center text-center mb-6">
      <!-- iPhone Squircle Icon -->
      <a href="/" class="group relative mb-3">
        <div class="w-16 h-16 rounded-[22px] bg-gradient-to-tr from-[#0071E3] via-[#38BDF8] to-[#818CF8] p-0.5 shadow-[0_8px_20px_rgba(0,113,227,0.3)] transition-transform duration-300 group-hover:scale-105 active:scale-95 flex items-center justify-center">
          <div class="w-full h-full bg-white/20 backdrop-blur-md rounded-[20px] flex items-center justify-center">
            <svg class="w-8 h-8 text-white drop-shadow-md" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM10 17l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z" opacity="0"/>
              <!-- Video Scissors Clip Icon -->
              <path d="M9.64 7.64c.23-.5.36-1.05.36-1.64 0-2.21-1.79-4-4-4S2 3.79 2 6s1.79 4 4 4c.59 0 1.14-.13 1.64-.36L10 12l-2.36 2.36C7.14 14.13 6.59 14 6 14c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4c0-.59-.13-1.14-.36-1.64L12 14l7 7h3v-1L9.64 7.64zM6 8c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm0 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm9.64-10.36L22 3h-3l-5 5 1.64 1.64z"/>
            </svg>
          </div>
        </div>
      </a>

      <div class="flex items-center gap-1.5">
        <h1 class="text-2xl font-bold tracking-tight text-[#1D1D1F]">Jax<span class="text-[#0071E3]">Cliped</span></h1>
      </div>
      <p id="page-subtitle" class="text-xs font-medium text-[#86868B] mt-1">
        Sign in to your AI stream clipping studio
      </p>
    </div>

    <!-- Apple Segmented Control (Tabs) -->
    <div class="bg-black/[0.05] p-1 rounded-full flex items-center mb-6 relative">
      <button id="tab-login" onclick="setMode('login')" class="flex-1 py-1.5 text-xs font-semibold rounded-full transition-all duration-300 text-[#1D1D1F] bg-white shadow-sm">
        Sign In
      </button>
      <button id="tab-signup" onclick="setMode('signup')" class="flex-1 py-1.5 text-xs font-semibold rounded-full transition-all duration-300 text-[#86868B] hover:text-[#1D1D1F]">
        Create Account
      </button>
    </div>

    <!-- Auth Form -->
    <form onsubmit="handleAuth(event)" class="space-y-4">
      
      <!-- Name (Signup Only) -->
      <div id="group-name" class="hidden">
        <label class="block text-[11px] font-semibold tracking-wide text-[#86868B] uppercase mb-1.5 ml-1">Your Name</label>
        <div class="relative">
          <input type="text" id="input-name" placeholder="Alex Rivers" class="ios-input-glass w-full px-4 py-3 rounded-2xl text-sm text-[#1D1D1F] placeholder-black/30 font-medium"/>
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-[11px] font-semibold tracking-wide text-[#86868B] uppercase mb-1.5 ml-1">Email</label>
        <div class="relative">
          <input type="email" id="input-email" required placeholder="alex@gmail.com" class="ios-input-glass w-full px-4 py-3 rounded-2xl text-sm text-[#1D1D1F] placeholder-black/30 font-medium"/>
        </div>
      </div>

      <!-- Password -->
      <div>
        <div class="flex justify-between items-center mb-1.5 ml-1">
          <label class="block text-[11px] font-semibold tracking-wide text-[#86868B] uppercase">Password</label>
          <a href="#" id="forgot-link" onclick="handleForgot(event)" class="text-xs font-medium text-[#0071E3] hover:underline">Forgot?</a>
        </div>
        <div class="relative">
          <input type="password" id="input-password" required placeholder="••••••••" class="ios-input-glass w-full px-4 py-3 rounded-2xl text-sm text-[#1D1D1F] placeholder-black/30 font-medium pr-10"/>
          <button type="button" onclick="togglePass('input-password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-black/30 hover:text-black/60 transition">
            <span class="material-symbols-rounded text-lg">visibility</span>
          </button>
        </div>
      </div>

      <!-- Confirm Password (Signup Only) -->
      <div id="group-confirm" class="hidden">
        <label class="block text-[11px] font-semibold tracking-wide text-[#86868B] uppercase mb-1.5 ml-1">Confirm Password</label>
        <div class="relative">
          <input type="password" id="input-confirm" placeholder="••••••••" class="ios-input-glass w-full px-4 py-3 rounded-2xl text-sm text-[#1D1D1F] placeholder-black/30 font-medium pr-10"/>
        </div>
      </div>

      <!-- Toast / Error Message -->
      <div id="auth-alert" class="hidden text-xs py-2 px-3 rounded-xl font-medium text-center"></div>

      <!-- Primary Action Pill Button -->
      <button type="submit" id="submit-btn" class="w-full py-3.5 px-6 rounded-full bg-[#0071E3] hover:bg-[#0077ED] text-white text-sm font-semibold shadow-[0_4px_16px_rgba(0,113,227,0.35)] transition-all duration-200 active:scale-[0.98] mt-2 flex items-center justify-center gap-2">
        <span id="btn-text">Sign In</span>
      </button>

    </form>

    <!-- Footer Switch Note -->
    <p class="text-center text-xs text-[#86868B] mt-6">
      <span id="footer-prompt">Don't have an account?</span>
      <button type="button" onclick="toggleMode()" id="footer-action" class="font-semibold text-[#0071E3] hover:underline ml-1">
        Sign Up
      </button>
    </p>

  </div>

  <script>
    let mode = window.location.pathname.includes('signup') ? 'signup' : 'login';

    function setMode(newMode) {
      mode = newMode;
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const groupName = document.getElementById('group-name');
      const groupConfirm = document.getElementById('group-confirm');
      const forgotLink = document.getElementById('forgot-link');
      const btnText = document.getElementById('btn-text');
      const pageSubtitle = document.getElementById('page-subtitle');
      const footerPrompt = document.getElementById('footer-prompt');
      const footerAction = document.getElementById('footer-action');
      const alert = document.getElementById('auth-alert');
      alert.classList.add('hidden');

      if (mode === 'signup') {
        tabSignup.className = "flex-1 py-1.5 text-xs font-semibold rounded-full transition-all duration-300 text-[#1D1D1F] bg-white shadow-sm";
        tabLogin.className = "flex-1 py-1.5 text-xs font-semibold rounded-full transition-all duration-300 text-[#86868B] hover:text-[#1D1D1F]";
        groupName.classList.remove('hidden');
        groupConfirm.classList.remove('hidden');
        forgotLink.classList.add('hidden');
        btnText.innerText = "Create Account";
        pageSubtitle.innerText = "Get started with JaxCliped AI Studio";
        footerPrompt.innerText = "Already have an account?";
        footerAction.innerText = "Sign In";
        history.replaceState(null, '', '/signup');
      } else {
        tabLogin.className = "flex-1 py-1.5 text-xs font-semibold rounded-full transition-all duration-300 text-[#1D1D1F] bg-white shadow-sm";
        tabSignup.className = "flex-1 py-1.5 text-xs font-semibold rounded-full transition-all duration-300 text-[#86868B] hover:text-[#1D1D1F]";
        groupName.classList.add('hidden');
        groupConfirm.classList.add('hidden');
        forgotLink.classList.remove('hidden');
        btnText.innerText = "Sign In";
        pageSubtitle.innerText = "Sign in to your AI stream clipping studio";
        footerPrompt.innerText = "Don't have an account?";
        footerAction.innerText = "Sign Up";
        history.replaceState(null, '', '/login');
      }
    }

    function toggleMode() {
      setMode(mode === 'login' ? 'signup' : 'login');
    }

    function togglePass(id) {
      const el = document.getElementById(id);
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    function showAlert(msg, isSuccess = false) {
      const alert = document.getElementById('auth-alert');
      alert.innerText = msg;
      alert.className = `text-xs py-2 px-3 rounded-xl font-medium text-center ${isSuccess ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`;
      alert.classList.remove('hidden');
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value.trim();
      const password = document.getElementById('input-password').value;
      const btn = document.getElementById('submit-btn');

      if (mode === 'signup') {
        const confirm = document.getElementById('input-confirm').value;
        if (password !== confirm) {
          showAlert("Passwords do not match");
          return;
        }
      }

      btn.disabled = true;
      btn.classList.add('opacity-70');

      try {
        const endpoint = mode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
        const payload = mode === 'signup' 
          ? { email, password, name: document.getElementById('input-name').value.trim() || email.split('@')[0] }
          : { email, password };

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Authentication failed");

        showAlert("Success! Entering JaxCliped Studio...", true);
        setTimeout(() => { window.location.href = '/app'; }, 400);

      } catch (err) {
        showAlert(err.message || "An error occurred");
        btn.disabled = false;
        btn.classList.remove('opacity-70');
      }
    }

    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value.trim();
      if (!email) {
        showAlert("Enter your email address first");
        return;
      }
      try {
        await fetch('/api/auth/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        showAlert("Password reset link sent to your email", true);
      } catch {
        showAlert("Failed to send reset link");
      }
    }

    // Initialize initial state
    setMode(mode);
  </script>
</body>
</html>
