<svg width="750" height="220" viewBox="0 0 750 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="appleGradLogo" x1="0" y1="0" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="glareLogo" x1="0" y1="0" x2="220" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- iOS Squircle Icon -->
  <rect x="10" y="10" width="200" height="200" rx="48" fill="url(#appleGradLogo)"/>
  <rect x="10" y="10" width="200" height="100" rx="48" fill="url(#glareLogo)"/>
  <rect x="11" y="11" width="198" height="198" rx="47" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

  <!-- Scissor / Clipper Inside Squircle -->
  <circle cx="80" cy="80" r="20" stroke="#FFFFFF" stroke-width="11" fill="none"/>
  <circle cx="80" cy="140" r="20" stroke="#FFFFFF" stroke-width="11" fill="none"/>
  <path d="M96 90 L150 140" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <path d="M96 130 L150 80" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <polygon points="120,98 148,110 120,122" fill="#FFFFFF"/>

  <!-- JaxCliped Brand Text -->
  <text x="245" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="94" font-weight="800" fill="#1D1D1F" letter-spacing="-3">Jax<tspan fill="#0071E3">Cliped</tspan></text>
</svg>
